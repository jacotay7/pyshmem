name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install -e .
          # --skip-editable excludes pyshmem itself (installed editable): the
          # project's own about-to-be-released version is never on PyPI, so
          # auditing it would always fail. Runtime deps are still audited.
          pip-audit --local --strict --skip-editable

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Smoke test built wheel
        run: |
          python -m venv /tmp/pyshmem-wheel-test
          /tmp/pyshmem-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/pyshmem-wheel-test/bin/pip install dist/*.whl
          /tmp/pyshmem-wheel-test/bin/python -c "import pyshmem; print(pyshmem.__name__)"

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"

      - name: Build documentation
        run: sphinx-build -W -b html docs docs/_build/html

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      # The per-test timeout is a safety net so a future hang fails the job
      # instead of wedging the runner for hours.
      - name: Run CPU test suite
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
        run: >-
          pytest -m "cpu and not benchmark" -q
          --timeout=120 --timeout-method=thread

      - name: Run benchmark smoke
        env:
          pyshmem_ENFORCE_BENCHMARK: "0"
          pyshmem_TARGET_HZ: "50000"
          PYTHONFAULTHANDLER: "1"
        run: >-
          pytest -m "cpu and benchmark" -q -s
          --timeout=120 --timeout-method=thread
